<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>EV 충전 빈자리</title>
  <meta name="description" content="지도에서 전기차 충전소의 빈 충전기를 실시간으로 찾습니다.">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="app" data-sheet="half">
  <aside class="panel" id="panel" aria-label="검색과 결과">
    <button class="sheet-handle" id="sheet-handle" type="button" aria-label="목록 크게 보기">
      <span class="sheet-handle__bar" aria-hidden="true"></span>
    </button>
    <header class="panel__header">
      <div class="brand">
        <h1>EV 충전 빈자리</h1>
        <div class="brand__actions">
          <span class="live" id="live" data-state="connecting" role="status">연결 중</span>
          <button class="button button--small" id="inbox-open" type="button" aria-haspopup="true">
            내 알림 <span class="count" id="inbox-count" hidden></span>
          </button>
        </div>
      </div>

      <form class="search" id="search-form" autocomplete="off" role="search">
        <label class="sr-only" for="keyword">충전소 이름이나 주소</label>
        <input class="search__input" id="keyword" type="search" maxlength="50" placeholder="강남구청, 테헤란로 같은 이름·주소">
        <button class="button button--primary" type="submit">검색</button>
      </form>

      <div class="filters" role="group" aria-label="필터">
        <label class="chip">
          <input type="checkbox" id="available-only">
          <span>빈자리만</span>
        </label>
        <label class="sr-only" for="min-output">최소 출력</label>
        <select id="min-output" class="select">
          <option value="">모든 출력</option>
          <option value="50">50kW 이상 (급속)</option>
          <option value="100">100kW 이상</option>
        </select>
      </div>

      <p class="summary" id="summary" aria-live="polite">지도를 움직이면 보이는 곳의 충전소를 찾습니다.</p>
      <button class="link-button" id="back-to-area" type="button" hidden>← 지도 영역 검색으로 돌아가기</button>
    </header>

    <ol class="list" id="list" aria-label="충전소 목록"></ol>

    <section class="detail" id="detail" hidden aria-labelledby="detail-name">
      <button class="link-button" id="detail-close" type="button">← 목록으로</button>
      <h2 class="detail__name" id="detail-name" tabindex="-1"></h2>
      <p class="detail__address" id="detail-address"></p>
      <button class="button subscribe" id="detail-subscribe" type="button" aria-pressed="false">빈자리 알림 받기</button>
      <button class="button button--small dev-test" id="detail-test" type="button" hidden>테스트 빈자리 만들기 (개발용)</button>
      <dl class="detail__info" id="detail-info"></dl>
      <h3 class="detail__subtitle">충전기</h3>
      <ul class="chargers" id="detail-chargers"></ul>
      <p class="detail__note">상태는 공공데이터 기준이며 수 분 늦을 수 있습니다. 충전대기여도 일반 차량이 주차해 있을 수 있습니다.</p>
    </section>

    <section class="detail inbox" id="inbox" hidden aria-labelledby="inbox-title">
      <button class="link-button" id="inbox-close" type="button">← 목록으로</button>
      <h2 class="detail__name" id="inbox-title" tabindex="-1">내 알림</h2>
      <p class="detail__note">알림을 켠 충전소에 자리가 나면 이 화면이 열려 있는 동안 바로 알려 드립니다. 같은 충전소 알림은 10분에 한 번만 보냅니다.</p>
      <h3 class="detail__subtitle">알림 받는 충전소</h3>
      <ul class="inbox__list" id="inbox-subscriptions"></ul>
      <h3 class="detail__subtitle">최근 알림</h3>
      <ul class="inbox__list" id="inbox-notifications"></ul>
    </section>
  </aside>

  <main class="map-area">
    <div class="map" id="map" role="application" aria-label="충전소 지도"></div>
    <div class="map-message" id="map-message" hidden></div>
    <div class="map-notice" id="map-notice" hidden role="status"></div>
    <div class="legend" aria-hidden="true">
      <span><i class="dot dot--available"></i>빈자리 있음</span>
      <span><i class="dot dot--busy"></i>모두 사용 중</span>
      <span><i class="dot dot--off"></i>사용 불가</span>
    </div>
    <button class="button locate" id="locate" type="button" hidden>내 위치</button>
  </main>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="/js/app.js"></script>
</body>
</html>
